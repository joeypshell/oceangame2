name: Progression Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  progression-audit:
    name: Progression audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run focused progression fixtures
        run: python tools/test_progression_graph.py
      - name: Run proposed creature progression fixtures
        run: python tools/test_progression_graph_creatures.py
      - name: Run Living Expedition 05 schema and progression fixtures
        run: python tools/test_living_expedition_05_contract.py
      - name: Audit source-derived progression graph
        run: python tools/audit_progression_graph.py
