name: Godot Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/godot-smoke.yml"
      - "assets/**"
      - "maps/**"
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tools/**"
      - "visual_captures/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/godot-smoke.yml"
      - "assets/**"
      - "maps/**"
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tools/**"
      - "visual_captures/**"

permissions:
  contents: read

concurrency:
  group: "godot-smoke-${{ github.ref }}"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: stable

jobs:
  source-validation:
    name: Source and map validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Godot
        run: bash tools/ci/install_godot.sh

      - name: Import Godot assets
        run: bash tools/ci/run_godot_checked.sh asset-import 300 --headless --path . --import

      - name: Run source and map validation
        run: bash tools/ci/run_source_validation.sh

  core-runtime:
    name: Core runtime smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Godot
        run: bash tools/ci/install_godot.sh

      - name: Import Godot assets
        run: bash tools/ci/run_godot_checked.sh asset-import 300 --headless --path . --import

      - name: Run core runtime smoke checks
        run: bash tools/ci/run_core_smokes.sh

  regional-journeys:
    name: Regional journey smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Godot
        run: bash tools/ci/install_godot.sh

      - name: Import Godot assets
        run: bash tools/ci/run_godot_checked.sh asset-import 300 --headless --path . --import

      - name: Run regional and expansion journey smoke checks
        run: bash tools/ci/run_journey_smokes.sh
